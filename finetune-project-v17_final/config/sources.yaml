    max_pages: 40
  - id: british_army_public
    domain: military.british_army
    authority: official_primary
    language: en
    urls: [https://www.army.mod.uk/support-and-training/our-schools-and-colleges/centre-for-army-leadership/army-leadership-publications/, https://www.gov.uk/government/publications/uk-defence-doctrine-jdp-0-01]
